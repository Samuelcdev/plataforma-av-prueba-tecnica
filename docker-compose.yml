services:
  app:
    build: .
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "
      composer install &&
      cp .env.example .env || true &&
      php artisan key:generate &&
      php artisan migrate --seed --force &&
      php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - laravel-net

  node:
    image: node:20-alpine
    container_name: laravel-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: sh -c "
      npm install &&
      npm run dev -- --host"
    networks:
      - laravel-net

  db:
    image: mysql:8.0
    container_name: laravel-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: plataforma_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 10
    networks:
      - laravel-net

volumes:
  dbdata:

networks:
  laravel-net:
services:
  mysql:
    image: mysql:8.0
    container_name: plataforma-bd
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: plataforma_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
